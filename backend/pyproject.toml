[project]
name = "roxroom-ai"
version = "0.1.0"
description = "LiveKit voice room with two Hinglish AI participants (Roxstar AI Dost / Sathi)"
requires-python = ">=3.11"
dependencies = [
    "livekit>=0.19",
    "livekit-api>=0.8",
    "python-dotenv>=1.0",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "websockets>=13",
    "silero-vad>=6.0",
    "onnxruntime>=1.20",
    "anthropic>=0.40",
    "openai>=1.50",
    "groq>=0.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]
server = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
